# Producción en el Droplet. La app no publica puertos a internet:
# cloudflared abre un túnel saliente hacia Cloudflare, y Cloudflare Access hace el login.
#   docker compose pull && docker compose up -d
services:
  app:
    image: ghcr.io/czapata2020/gastos-familiares-app:${TAG:-latest}
    env_file: .env
    volumes:
      - ./data:/data            # base SQLite + backups diarios: NO borrar
    ports:
      - "127.0.0.1:3000:3000"   # solo desde el propio Droplet (ssh), útil para diagnosticar
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    restart: unless-stopped
