#cloud-config
# Pegar en DigitalOcean → Create Droplet → Advanced options → "Add Initialization scripts (user data)".
# Deja el Droplet con Docker, firewall (solo SSH), swap y la carpeta /opt/gastos lista.
package_update: true
package_upgrade: true
packages: [ca-certificates, curl, ufw, sqlite3, unattended-upgrades]
runcmd:
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  # Solo SSH entrante: la app sale a internet por el túnel de Cloudflare, no abre puertos web
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw --force enable
  # 2 GB de swap para que un Droplet chico no se quede sin memoria
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - mkdir -p /opt/gastos/data && chown 1001:1001 /opt/gastos/data
  - timedatectl set-timezone America/Lima
